<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear / Editar Evento</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <nav class="barra-navegacion">
        <span class="logo">Eventos</span>
        <a class="btn-cerrar" href="events.html">Volver</a>
    </nav>

    <div class="contenedor">
        <div class="caja-formulario">

            <h1 id="tituloForm" class="titulo">Crear Evento</h1>

            <form id="formEvento">

                <label for="titulo">Titulo</label>
                <input type="text" id="titulo" placeholder="Ej: Conferencia de robotica" required>

                <div class="fila-doble">
                    <div>
                        <label for="fechaInicio">Fecha de inicio</label>
                        <input type="date" id="fechaInicio" required>
                    </div>
                    <div>
                        <label for="fechaFin">Fecha de finalizacion</label>
                        <input type="date" id="fechaFin" required>
                    </div>
                </div>

                <div class="fila-doble">
                    <div>
                        <label for="horaInicio">Hora de inicio</label>
                        <input type="time" id="horaInicio" required>
                    </div>
                    <div>
                        <label for="horaFin">Hora de finalizacion</label>
                        <input type="time" id="horaFin" required>
                    </div>
                </div>

                <label for="descripcion">Descripcion</label>
                <textarea id="descripcion" rows="4" placeholder="Describe el evento"></textarea>

                <label for="localizacion">Localizacion</label>
                <input type="text" id="localizacion" placeholder="Ej: Auditorio principal">


                <label for="tipo">Tipo de evento</label>
                <select id="tipo">
                    <option value="Conferencia">Conferencia</option>
                    <option value="Taller">Taller</option>
                    <option value="Deportivo">Deportivo</option>
                    <option value="Cultural">Cultural</option>
                    <option value="Otro">Otro</option>
                </select>

                <button type="submit" class="btn">Guardar Evento</button>

                <p class="texto-link">
                    <a href="events.html">Cancelar</a>
                </p>

            </form>

            <div id="mensaje"></div>

        </div>
    </div>

    <script src="auth.js"></script>

</body>
</html>
