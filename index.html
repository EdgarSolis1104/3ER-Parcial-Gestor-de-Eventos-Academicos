<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTOR DE EVENTOS ACADEMICOS</title>
</head>
<body>
   <div class="container">
           <div class="caja.formulario">
                <h1 class="titulo">INICIAR SESION</h1>
                <from id="formLogin"></from>

                    <label for="correo">CORREO ELECTRONICO</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com">

                    <label for="pass">CONTRASEÑA</label>
                    <input type="password" id="pass" placeholder="Tu CONTRASEÑA" required>
                    
                    <label>ERES:</label>
                    <div class="opciones-rol">
                        <label class="rol">
                            <input type="radio" name="rol" value="alumno"checked>ALUMNO
                        </label>
                        <label class="rol">
                            <input type="radio" name="rol" value="profesor">PROFESOR
                        </label>
                    </div>
        
           </div>
   </div>
</body>
</html>
