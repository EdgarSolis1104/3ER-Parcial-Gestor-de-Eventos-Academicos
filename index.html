<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de login</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <h2>Prueba de login</h2>
    <p>solo con client ID</p>

    <button id="loginButton">Login con Google</button>
    <div id="resultado"></div>

    <!-- Botones de prueba de Calendar, aparecen despues del login -->
    <div id="calendarBotones">
        <button id="crearBtn">Crear evento de prueba</button>
        <button id="logoutBtn">Cerrar sesión</button>
    </div>

    <!-- Aqui se pinta la lista de eventos con botones editar/eliminar -->
    <div id="listaEventos"></div>

    <!-- Aqui se muestra la respuesta cruda de la API -->
    <pre id="salida"></pre>

    <p class="warn">Advertencia: Este ejemplo es solo para fines de demostración y esta sujeto a revisiones.</p>

    <!-- Librería de Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Configuración local con el Client ID (no se sube al repo) -->
    <script src="config.js"></script>
    
    <!-- Módulos de la app -->
    <script src="js/auth.js"></script>
    <script src="js/calendar.js"></script>
    <script src="js/eventos.js"></script>
    <script src="js/ui.js"></script>
</body>
</html>
