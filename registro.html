<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>CREAR CUENTA - EVENTOS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <div class="caja-formmulario">

            <h1 class="titulo">CREAR CUENTA</h1>

            <from id="formRegistro">
                <label for="nombre">NOMBRE COMPLETO</label>
                <input type="text" id="nombre" placeholder="Tu Nombre" required>

                <label for="correo">CORREO ELECTRONICO</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com required">

                <label for="pass">CONTRASEÑA</label>
                <input type="password" id="pass" placeholder="Minimo 6 Caracteres" required>

                <label for="pass2">CONFIRMAR CONNTRASEÑA</label>
                <input type="password" id="pass2" placeholder="Escribe Otra Vez Tu Contraseña" required>

                <label>Te Registras Como:</label>
                <div class="opciones-rol">
                    <label class="rol">
                        <input type="radio" name="rol" value="alumno">ALUMNO
                    </label>
                    <Label class="rol">
                        <input type="radio" name="rol" value="profesor">PROFESOR
                    </Label>
                </div>

                <button type="submit" class="btn">CREAR CUENTA</button>

                <p class="text-link">
                        ¿YA TIENES CUENTA?
                        <a href="index.html">INICIAR SESION AQUÍ</a>
                </p>
            </from>
        </div>
    </div>
    
</body>
</html>
